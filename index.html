<style>
/* Layout: single centered exam sheet; sticky top bar with timer, question card, number grid below */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#5b6579; --line:#d6dce8;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --good:#15803d; --good-soft:#dcf5e4; --bad:#b91c1c; --bad-soft:#fde4e4; --warn:#b45309; --warn-soft:#fdf0d8;
  --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;margin:0}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
/* start */
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.fact{flex:1 1 130px;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.fact b{display:block;font:600 26px var(--mono)}
.fact span{font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.hrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.hb{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;color:inherit}.hb:hover{color:var(--accent)}
.hrow span:last-child{font-family:var(--mono);font-weight:600}
/* exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer{font:600 24px var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.prog{font-size:14px;color:var(--muted)}
.qno{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.qtext{font:500 21px/1.4 var(--serif);margin:6px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 13px var(--mono)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:600 14px var(--mono)}
.gn.done{background:var(--accent-soft);border-color:var(--accent)}
.gn.cur{outline:3px solid var(--accent);outline-offset:1px}
.gn.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.gn.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.gn.skip{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.confirm{border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm div{display:flex;gap:10px;flex-wrap:wrap}
/* result */
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font:600 56px var(--mono);line-height:1}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.no{background:var(--bad-soft);color:var(--bad)}.pill.skip{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14px;font-weight:500}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rev{display:flex;flex-direction:column;gap:12px}
.ri{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:14px 16px;background:var(--surface)}
.ri.ok{border-left-color:var(--good)}.ri.no{border-left-color:var(--bad)}.ri.skip{border-left-color:var(--warn)}
.rh{display:block;width:100%;text-align:left;background:none;border:0;padding:0 0 8px;cursor:pointer}
.rq{display:block;font:500 17px/1.4 var(--serif)}
.ans.x{background:var(--bg);color:var(--muted)}
.ans{font-size:15px;margin:2px 0;padding:6px 10px;border-radius:6px}
.ans.g{background:var(--good-soft);color:var(--good)}
.ans.b{background:var(--bad-soft);color:var(--bad)}
.ans.n{background:var(--warn-soft);color:var(--warn)}
.ans small{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:480px){.qtext{font-size:19px}.score b{font-size:44px}.timer{font-size:21px}}
</style>

   ${open?`<div class="all">${q.opts.map((o,k)=>`<div class="ans ${k===q.ok?'g':k===q.pick?'b':'x'}"><small>${LETTERS[k]}${k===q.ok?' · düzgün cavab':k===q.pick?' · sizin cavab':''}</small>${esc(o)}</div>`).join('')}</div>`:
   (s==='ok'?`<div class="ans g"><small>Sizin cavab · düzdür</small>${esc(q.opts[q.pick])}</div>`:
     `${s==='no'?`<div class="ans b"><small>Sizin cavab · səhv</small>${esc(q.opts[q.pick])}</div>`:`<div class="ans n"><small>Cavab verilməyib</small></div>`}<div class="ans g"><small>Düzgün cavab</small>${esc(q.opts[q.ok])}</div>`)}</div>`}).join('')||'<div class="card" style="color:var(--muted)">Bu bölmədə sual yoxdur.</div>'}</div>`;
  $('#again').onclick=start;$('#hm').onclick=home;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;renderResult()});
  document.querySelectorAll('.rh').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;S.open.has(i)?S.open.delete(i):S.open.add(i);const y=window.scrollY;renderResult();window.scrollTo(0,y)});
  document.querySelectorAll('.gn').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;if(S.filter!=='all'&&S.filter!==st(S.qs[j]))S.filter='all';S.open.add(j);renderResult();document.getElementById('r'+j).scrollIntoView({block:'center'})});
}
home();
</script>
